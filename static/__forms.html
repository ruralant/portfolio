<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Netlify registers forms by parsing the deployed HTML at build time, so the
      contact form needs a plain-HTML twin here: the real form at /contact is
      submitted with fetch after Turnstile passes and is never seen by the build.
      Keep the field names in sync with src/routes/api/contact/+server.ts.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
