[build]
  command = "pnpm run build"
  publish = "build"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_USE_PNPM = "true"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"